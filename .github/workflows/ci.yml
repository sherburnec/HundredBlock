name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build flutter
      - run: docker compose run --rm flutter flutter pub get
      - run: docker compose run --rm flutter dart format --set-exit-if-changed .
      - run: docker compose run --rm flutter flutter analyze
      - run: docker compose run --rm flutter flutter test
