# Mimics GitHub Pages: gzip, short cache, also serves the build under /hundred-block/
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/mime.types;
  types { text/javascript mjs; }
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 256;
  add_header Cache-Control "max-age=600";

  location /hundred-block/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ =404;
  }
  location / {
    try_files $uri $uri/ =404;
  }
}
